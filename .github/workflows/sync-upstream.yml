name: Sync upstream

on:
  schedule:
    # 每 6 小时检查一次上游更新
    - cron: '17 */6 * * *'
  workflow_dispatch: # 手动触发按钮

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/t8y2/dbx.git
          git fetch upstream main

      - name: Sync fork main with upstream
        run: |
          git checkout main
          git merge upstream/main --no-edit --allow-unrelated-histories
          git push origin main
